<meta name="theme-color" content="#263473">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>بطاقة حساب الطالب | Student Account Card</title>
<style>
/* Layout: centered single-column lookup — dropdown stack above, revealed ID card below, matching the school's navy/white identity. Language toggle swaps dir + strings at runtime. */
:root{
  --bg:#eef0f6;
  --surface:#ffffff;
  --navy:#263473;
  --navy-deep:#1b2452;
  --ink:#1c2340;
  --muted:#6b7190;
  --line:#dde1ee;
  --accent:#2f9e6e;
  --accent-ink:#ffffff;
  --radius:16px;
  --font-ar:'Tajawal','Noto Kufi Arabic',sans-serif;
  --font-en:'Inter',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142a;
    --surface:#1a1e3c;
    --navy:#2f3d85;
    --navy-deep:#1b2452;
    --ink:#eef0fa;
    --muted:#9aa0c4;
    --line:#2d335c;
    --accent:#3fbd85;
    --accent-ink:#0b1120;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11142a;
  --surface:#1a1e3c;
  --navy:#2f3d85;
  --navy-deep:#1b2452;
  --ink:#eef0fa;
  --muted:#9aa0c4;
  --line:#2d335c;
  --accent:#3fbd85;
  --accent-ink:#0b1120;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ar);
  margin:0;
  padding-inline:16px;
  padding-top:calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  min-height:100%;
  min-width:320px;
  transition:background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
body[data-lang="en"]{font-family:var(--font-en)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px;width:100%}
button,a{touch-action:manipulation}

.id-bar{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  text-align:center;
  padding:10px 16px;
  border-radius:12px;
  background:var(--navy);
  background-image:linear-gradient(160deg, var(--navy), var(--navy-deep));
  color:#fff;
}
.id-bar .line1{font-size:13px;font-weight:800}
.id-bar .line2{font-size:11.5px;color:rgba(255,255,255,.78)}
.id-bar .sep{margin:0 6px;opacity:.55}

.top-bar{display:flex;justify-content:flex-end}
.lang-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:999px;
  padding:8px 16px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.lang-btn:hover{border-color:var(--navy);color:var(--navy)}
.lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang-btn svg{width:14px;height:14px}

.page-head{text-align:center;display:flex;flex-direction:column;gap:6px}
.top-logos{
  display:flex;
  justify-content:center;
  margin:4px 0 2px;
}
.top-logos img{
  height:48px;
  width:auto;
  max-width:100%;
  border-radius:9px;
}
@media (max-width:420px){
  .top-logos img{height:38px}
}
.page-head .eyebrow{
  font-family:var(--font-en);
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
}
.page-head h1{
  margin:0;
  font-size:clamp(20px,5vw,27px);
  font-weight:800;
  text-wrap:balance;
}
.page-head p{margin:0;color:var(--muted);font-size:14px}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field select{
  appearance:none;
  width:100%;
  padding:13px 44px 13px 16px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background-color:var(--surface);
  background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:right 18px center, right 12px center;
  background-size:6px 6px, 6px 6px;
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:inherit;
  font-size:16px;
  min-height:48px;
}
body[data-lang="ar"] .field select{
  padding:13px 16px 13px 44px;
  background-position:left 18px center, left 12px center;
}
.field select:disabled{opacity:.5}
.field select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Blueprint trace: a short glowing arc continuously sweeps the field's border, like a scanning schematic line */
@property --bp-angle{
  syntax:'<angle>';
  inherits:false;
  initial-value:0deg;
}
.blueprint-box{
  position:relative;
  border-radius:12px;
}
.blueprint-box::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:14px;
  padding:1.5px;
  background:conic-gradient(from var(--bp-angle), transparent 0 78%, var(--accent) 88%, var(--navy) 94%, transparent 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.75;
  animation:bp-sweep 3.4s linear infinite;
  pointer-events:none;
}
.blueprint-box:has(select:disabled)::before{opacity:.22;animation-play-state:paused}
@keyframes bp-sweep{ to{ --bp-angle:360deg; } }
@media (prefers-reduced-motion: reduce){
  .blueprint-box::before{animation:none}
}
@supports not (background:conic-gradient(from 0deg, red, blue)){
  .blueprint-box::before{display:none}
}

.fetch-btn{
  appearance:none;
  border:none;
  border-radius:12px;
  padding:14px 20px;
  background:var(--navy);
  color:#fff;
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  min-height:50px;
  transition:background .15s ease, transform .1s ease;
}
.fetch-btn:hover{background:var(--navy-deep)}
.fetch-btn:active{transform:scale(.99)}
.fetch-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.fetch-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.notfound-btn{
  appearance:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1.5px dashed color-mix(in srgb, #c2410c 55%, var(--line));
  background:color-mix(in srgb, #c2410c 8%, var(--surface));
  color:#c2410c;
  border-radius:12px;
  padding:12px 16px;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  min-height:46px;
}
.notfound-btn:hover{background:color-mix(in srgb, #c2410c 14%, var(--surface));border-color:#c2410c}
.notfound-btn:focus-visible{outline:2px solid #c2410c;outline-offset:2px}
.notfound-btn svg{width:17px;height:17px;flex-shrink:0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .notfound-btn{color:#fb923c}
}
:root[data-theme="dark"] .notfound-btn{color:#fb923c}

/* ---- the card ---- */
#cardZone{display:flex;flex-direction:column;align-items:center}
.card{
  width:100%;
  max-width:520px;
  background:var(--surface);
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 18px 40px -22px rgba(27,36,82,.45);
}
.card-header{
  background:var(--navy);
  background-image:linear-gradient(160deg, var(--navy), var(--navy-deep));
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card-header img{display:block;width:100%;max-width:420px;height:auto}

.card-meta{
  padding:14px 22px;
  text-align:center;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb, var(--navy) 6%, var(--surface));
}
.card-meta .school{font-weight:800;font-size:15px}
.card-meta .year{font-family:var(--font-en);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}

.card-body{padding:22px}
.grade-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:color-mix(in srgb, var(--accent) 14%, transparent);
  color:var(--accent);
  font-family:var(--font-en);
  font-weight:700;
  font-size:13px;
  padding:6px 14px;
  border-radius:999px;
  margin-bottom:16px;
}

.student-name{
  font-size:22px;
  font-weight:800;
  margin:0 0 18px;
  text-wrap:balance;
  font-family:var(--font-ar);
}

.cred-list{display:flex;flex-direction:column;gap:12px}
.cred-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  border:1px dashed var(--line);
  border-radius:12px;
  background:color-mix(in srgb, var(--navy) 3%, var(--surface));
}
.cred-row .k{font-size:13px;color:var(--muted);white-space:nowrap}
.cred-row .v{
  font-family:var(--font-en);
  font-weight:700;
  font-size:15px;
  direction:ltr;
  word-break:break-all;
  text-align:left;
}
.cred-row .v.site{
  font-weight:600;
  font-size:13px;
  color:var(--navy);
  text-decoration:underline;
  text-underline-offset:2px;
  cursor:pointer;
}
.cred-row .v.site:hover{color:var(--navy-deep)}
.cred-row .v.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .cred-row .v.site{color:#9bb4ff}
}
:root[data-theme="dark"] .cred-row .v.site{color:#9bb4ff}

.copy-btn{
  appearance:none;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  border-radius:8px;
  padding:6px 10px;
  font-size:12px;
  font-family:inherit;
  cursor:pointer;
  flex-shrink:0;
}
.copy-btn:hover{color:var(--ink);border-color:var(--muted)}
.copy-btn.copied{color:var(--accent);border-color:var(--accent)}

.card-footer{
  padding:18px 22px 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--navy-deep);
}
.card-footer img{height:28px;width:auto}

[hidden]{display:none!important}

.actions-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:16px;
  width:100%;
  max-width:520px;
}
.action-btn{
  appearance:none;
  flex:1 1 150px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:11px 12px;
  font-family:inherit;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  min-height:42px;
  transition:border-color .15s ease, color .15s ease;
}
.action-btn svg{width:16px;height:16px;flex-shrink:0}
.action-btn:hover{border-color:var(--navy);color:var(--navy)}
.action-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.action-btn.copied{border-color:var(--accent);color:var(--accent)}

@media (max-width:420px){
  .panel{padding:18px}
  .card-body{padding:18px}
  .cred-row{flex-direction:row;flex-wrap:wrap}
}

@media print{
  body{background:#fff;padding:0}
  .page-head,.panel,.actions-row,.top-bar,.id-bar{display:none!important}
  .wrap{max-width:none;gap:0}
  #cardZone{min-height:100vh;align-items:center;justify-content:center;display:flex}
  .card{box-shadow:none;border:1px solid #ccc;max-width:480px}
}
</style>

function formatGroup(group, lang){
  const m = group.match(/Grade (\d+)([A-Z]?)/);
  const num = m ? m[1] : group;
  const letter = m ? (m[2] || '') : '';
  return (lang === 'ar' ? 'الصف ' : 'Grade ') + num + letter;
}

function groupNum(g){
  const m = g.match(/\d+/);
  return m ? parseInt(m[0], 10) : 0;
}

const groups = [...new Set(STUDENTS.map(s => s.group))].sort((a,b) => {
  const d = groupNum(a) - groupNum(b);
  return d !== 0 ? d : a.localeCompare(b);
});

    opt.value = g;
    opt.textContent = formatGroup(g, LANG);
    gradeSelect.appendChild(opt);
  }
  gradeSelect.value = keepValue || '';
}

function buildStudentOptions(){
  const t = I18N[LANG];
  const g = gradeSelect.value;
  const keepValue = studentSelect.value;
  studentSelect.innerHTML = '';
  if (!g){
    studentSelect.disabled = true;
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = t.studentDefaultNoGrade;
    studentSelect.appendChild(opt);
    fetchBtn.disabled = true;
    return;
  }
  const opt0 = document.createElement('option');
  opt0.value = '';
  opt0.textContent = t.studentDefault;
  studentSelect.appendChild(opt0);

  const list = STUDENTS
    .map((s, idx) => ({...s, idx}))
    .filter(s => s.group === g)
    .sort((a,b) => a.name.localeCompare(b.name, 'ar'));

  for (const s of list){
    const opt = document.createElement('option');
    opt.value = s.idx;
    opt.textContent = s.name;
    studentSelect.appendChild(opt);
  }
  studentSelect.disabled = false;
  if (keepValue && [...studentSelect.options].some(o => o.value === keepValue)){
    studentSelect.value = keepValue;
  }
  fetchBtn.disabled = !studentSelect.value;
}

function applyStaticText(){
  const t = I18N[LANG];
  document.documentElement.setAttribute('lang', LANG);
  document.documentElement.setAttribute('dir', t.dir);
  document.body.setAttribute('dir', t.dir);
  document.body.setAttribute('data-lang', LANG);
  document.getElementById('t-eyebrow').textContent = t.eyebrow;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-subtitle').textContent = t.subtitle;
  document.getElementById('t-gradeLabel').textContent = t.gradeLabel;
  document.getElementById('t-studentLabel').textContent = t.studentLabel;
  document.getElementById('t-notFoundBtn').textContent = t.notFoundBtn;
  fetchBtn.textContent = t.fetchBtn;
  langBtnLabel.textContent = t.switchTo;
}

function setLanguage(lang){
  LANG = lang;
  try { localStorage.setItem('cardLookupLang', LANG); } catch(e) {}
  applyStaticText();
  buildGradeOptions();
  buildStudentOptions();
  if (studentSelect.value){
    const s = STUDENTS[parseInt(studentSelect.value, 10)];
    renderCard(s);
  } else {
    cardZone.innerHTML = '';
  }
}

langBtn.addEventListener('click', () => setLanguage(LANG === 'ar' ? 'en' : 'ar'));

gradeSelect.addEventListener('change', () => {
  buildStudentOptions();
  cardZone.innerHTML = '';
});

studentSelect.addEventListener('change', () => {
  fetchBtn.disabled = !studentSelect.value;
  cardZone.innerHTML = '';
});

function copyText(btn, text, doneLabel, originalLabel){
  const finish = () => {
    btn.textContent = doneLabel;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = originalLabel; btn.classList.remove('copied'); }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e) {}
  document.body.removeChild(ta);
}

function renderCard(s){
  const t = I18N[LANG];
  const groupLabel = formatGroup(s.group, LANG);
  cardZone.innerHTML = `
    <div class="card">
      <div class="card-header"><img src="${HEADER_IMG}" alt="Dar Al-Forsan Schools - Diploma Section"></div>
      <div class="card-meta">
        <div class="school">${t.schoolName}</div>
        <div class="year">${t.yearLine}</div>
      </div>
      <div class="card-body">
        <span class="grade-pill">${groupLabel}</span>
        <p class="student-name">${s.name}</p>
        <div class="cred-list">
          <div class="cred-row">
            <span class="k">${t.loginLabel}</span>
            <a class="v site" href="https://me.classera.com" target="_blank" rel="noopener noreferrer">me.classera.com</a>
          </div>
          <div class="cred-row">
            <span class="k">${t.usernameLabel}</span>
            <span class="v">${s.username}</span>
            <button class="copy-btn" data-copy="${s.username}">${t.copyBtn}</button>
          </div>
          <div class="cred-row">
            <span class="k">${t.passwordLabel}</span>
            <span class="v">${s.password}</span>
            <button class="copy-btn" data-copy="${s.password}">${t.copyBtn}</button>
          </div>
        </div>
      </div>
      <div class="card-footer"><img src="${CLASSERA_IMG}" alt="Classera"></div>
    </div>
    <div class="actions-row">
      <button class="action-btn" id="printBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
        <span>${t.printBtn}</span>
      </button>
      <button class="action-btn" id="imgBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span>${t.imgBtn}</span>
      </button>
      <button class="action-btn" id="copyAllBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>${t.copyAllBtn}</span>
      </button>
    </div>
  `;

  cardZone.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn, btn.getAttribute('data-copy'), t.copiedBtn, t.copyBtn));
  });

  document.getElementById('printBtn').addEventListener('click', () => window.print());

  document.getElementById('imgBtn').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const label = btn.querySelector('span');
    const original = label.textContent;
    const card = cardZone.querySelector('.card');
    if (typeof html2canvas !== 'function'){
      label.textContent = t.toolUnavailable;
      setTimeout(() => { label.textContent = original; }, 2200);
      return;
    }
    label.textContent = t.preparing;
    try {
      html2canvas(card, {scale: 3, backgroundColor: '#ffffff', useCORS: true}).then(canvas => {
        const link = document.createElement('a');
        link.download = `card_${s.username}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        label.textContent = original;
      }).catch(() => {
        label.textContent = t.imageFailed;
        setTimeout(() => { label.textContent = original; }, 2200);
      });
    } catch(err) {
      label.textContent = t.imageFailed;
      setTimeout(() => { label.textContent = original; }, 2200);
    }
  });

  document.getElementById('copyAllBtn').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const label = btn.querySelector('span');
    const original = label.textContent;
    const text = t.copyAllLines(s).join('\n');
    const finish = () => {
      btn.classList.add('copied');
      label.textContent = t.copyAllDone;
      setTimeout(() => { label.textContent = original; btn.classList.remove('copied'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
    } else {
      fallbackCopy(text, finish);
    }
  });
}

fetchBtn.addEventListener('click', () => {
  if (!studentSelect.value) return;
  const s = STUDENTS[parseInt(studentSelect.value, 10)];
  renderCard(s);
});

setLanguage(LANG);
</script>
</body>
</html>
